# Builds Kord for Windows and Linux and attaches the archives to a GitHub
# release when it's published (or on demand for an existing release tag).
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart("v")
          $name = "Kord-$version-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/kord.exe, LICENSE, README.md, CHANGELOG.md $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          gh release upload $env:TAG "$name.zip" --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo build --release
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="Kord-${TAG#v}-linux-x86_64"
          mkdir "$name"
          cp target/release/kord LICENSE README.md CHANGELOG.md "$name"
          tar czf "$name.tar.gz" "$name"
          gh release upload "$TAG" "$name.tar.gz" --clobber
