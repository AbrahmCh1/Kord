[workspace]
resolver = "3"
members = ["crates/kord-core", "crates/kord"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AbrahmCh1/Kord"
authors = ["Kord contributors"]
rust-version = "1.88"

[workspace.dependencies]
kord-core = { path = "crates/kord-core" }

# Keep release binaries small: this is a tray app that lives all day in the background.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
